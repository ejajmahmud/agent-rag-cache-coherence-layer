[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-rag-cache-coherence-layer"
version = "0.1.0"
description = "Semantic cache with automated invalidation when underlying documentation or source code files undergo git commits"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-rag-cache-coherence-layer = "agent_rag_cache_coherence_layer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_rag_cache_coherence_layer*"]
